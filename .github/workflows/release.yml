name: Release

# Runs when a version tag such as v0.1.0 is pushed, or by hand.
# It builds, tests, attaches the built files to a GitHub Release, and publishes to npm
# when the NPM_TOKEN secret is set and package.json is no longer marked private.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run size

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Pack the built files
        run: |
          mkdir -p release
          npm pack --pack-destination release
          (cd dist && zip -r ../release/chartist-lite-dist.zip .)

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed in this version." \
            || gh release upload "$GITHUB_REF_NAME" release/* --clobber

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set: skipping the npm publish."
            exit 0
          fi
          if [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "package.json is still marked private: skipping the npm publish."
            exit 0
          fi
          npm publish --access public --provenance
