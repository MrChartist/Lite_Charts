<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chartist Lite: the brick time axis</title>
<style>
  :root { color-scheme: light; --bg: #F8F8F8; --ink: #1D1D1F; --muted: #6E6E73; --card: #FFFFFF; --edge: rgba(0,0,0,0.1); }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #0C0C0C; --ink: #F5F5F7; --muted: #98989D; --card: #141414; --edge: rgba(255,255,255,0.12); }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
    font: 400 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); max-width: 70em; }
  h2 { font-size: 13px; font-weight: 600; margin: 18px 2px 8px; color: var(--muted); }
  .box { border-radius: 16px; overflow: hidden; border: 1px solid var(--edge); background: var(--card); }
  #big { height: 560px; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .pair .box { height: 300px; }
  @media (max-width: 700px) { .pair { grid-template-columns: minmax(0, 1fr); } #big { height: 380px; } }
  #probe { position: absolute; left: -10000px; top: 0; width: 900px; height: 320px; }
</style>
</head>
<body>
<h1>DEMO · Renko on a brick time axis</h1>
<p id="lede">Every brick sits on its own slot and keeps the date of the bar that made it. Labels sit only on bricks; a year
label that is not on a January brick names the month, a month label past the first week names the day.</p>
<div class="box" id="big"></div>
<h2>The same bars as candles and as Renko</h2>
<div class="pair"><div class="box" id="candles"></div><div class="box" id="renko"></div></div>
<div id="probe"></div>

<script src="../dist/chartist-lite.iife.min.js"></script>
<script src="../dist/chartist-lite-transforms.iife.min.js"></script>
<script>
  const L = ChartistLite;
  const T = ChartistLiteTransforms;
  const params = new URLSearchParams(location.search);
  let theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;

  // Deterministic business-day bars, 2004 to mid 2026: long trends with quiet stretches, so the bricks come in runs
  // and in gaps of months or years (the case the brick axis is for).
  function makeBars(from, to, seed) {
    let s = seed >>> 0;
    const rand = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    const out = [];
    let close = 40;
    for (let day = Date.UTC(from, 0, 1) / 1000; day < Date.UTC(to, 6, 1) / 1000; day += 86400) {
      const wd = new Date(day * 1000).getUTCDay();
      if (wd === 0 || wd === 6) continue;
      const n = out.length;
      const regime = Math.sin(n / 410) + 0.6 * Math.sin(n / 97);
      const vol = 0.014 + 0.03 * Math.max(0, Math.abs(regime) - 0.6);
      const open = close;
      close = Math.max(2, open * (1 + regime * 0.0012 + (rand() - 0.5) * vol));
      out.push({ time: new Date(day * 1000).toISOString().slice(0, 10), open, high: Math.max(open, close) * (1 + rand() * 0.006), low: Math.min(open, close) * (1 - rand() * 0.006), close, volume: Math.round(1000 + rand() * 4000) });
    }
    return out;
  }
  const bars = makeBars(2004, 2026, 11);

  const charts = [];
  const mk = (id, extra) => { const c = L.createChart(id, Object.assign({ theme, ariaLabel: 'DEMO ' + id }, extra || {})); charts.push(c); return c; };

  // The large Renko chart: bricks with their own volume.
  const big = mk('big');
  const a = T.applyChartType('renko', bars, { brick: { percent: 1.5 }, series: { title: 'DEMO Renko' } });
  const bigSeries = big.addSeries(a.definition, a.options);
  bigSeries.setData(a.data);
  const bigVol = big.addSeries(L.HistogramSeries, { priceScaleId: 'volume', lastValueVisible: false, priceLineVisible: false });
  big.priceScale('volume').applyOptions({ scaleMargins: { top: 0.84, bottom: 0 } });
  big.priceScale('right').applyOptions({ scaleMargins: { top: 0.08, bottom: 0.2 } });
  bigVol.setData(a.data.map(b => ({ time: b.time, value: b.volume })));
  big.timeScale().fitContent();

  // The same bars as candles (calendar axis) and as Renko (brick axis), the last two years.
  const recent = bars.slice(-504);
  const cc = mk('candles');
  const c1 = T.applyChartType('candles', recent, { series: { title: 'DEMO candles' } });
  cc.addSeries(c1.definition, c1.options).setData(c1.data);
  cc.timeScale().fitContent();
  const rc = mk('renko');
  const r1 = T.applyChartType('renko', recent, { brick: { percent: 1 }, series: { title: 'DEMO Renko' } });
  rc.addSeries(r1.definition, r1.options).setData(r1.data);
  rc.timeScale().fitContent();

  function setTheme(name) {
    theme = name;
    document.documentElement.dataset.theme = name;
    charts.forEach(c => c.applyOptions({ theme: name }));
  }

  /** Bricks from explicit rows on a fixed-size chart (900 x 320) for the browser checks; replaces the previous probe. */
  let probe = null;
  function makeProbe(rows, opts) {
    if (probe) probe.remove();
    probe = L.createChart('probe', Object.assign({ theme, legend: { visible: false } }, opts || {}));
    const s = probe.addSeries(T.ordinalSeries(L.CandlestickSeries), { title: 'PROBE' });
    s.setData(rows);
    probe.timeScale().fitContent();
    probe.paint();
    return { chart: probe, series: s };
  }

  window.__axis = { L, T, bars, big, bigSeries, bigVol, applied: a, candles: cc, renko: rc, setTheme, makeProbe };
</script>
</body>
</html>
