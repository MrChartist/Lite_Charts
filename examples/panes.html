<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chartist Lite: panes</title>
<style>
  :root { color-scheme: light; --bg: #F8F8F8; --ink: #1D1D1F; --muted: #6E6E73; --card: #FFFFFF; --edge: rgba(0,0,0,0.1); }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #0C0C0C; --ink: #F5F5F7; --muted: #98989D; --card: #141414; --edge: rgba(255,255,255,0.12); }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
    font: 400 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  button { font: inherit; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--edge);
    background: var(--card); color: var(--ink); cursor: pointer; }
  button:focus-visible { outline: 2px solid #0066CC; outline-offset: 2px; }
  #chart { height: 520px; border-radius: 16px; overflow: hidden; border: 1px solid var(--edge); background: var(--card); }
</style>
</head>
<body>
<header>
  <h1>DEMO · price, volume and benchmark above, RSI 14 below</h1>
  <div>
    <button id="theme" type="button">Dark theme</button>
    <button id="fit" type="button">Show all</button>
  </div>
</header>
<div id="chart"></div>
<script src="../dist/chartist-lite.iife.min.js"></script>
<script>
  function makeBars(count, seed) {
    let s = seed >>> 0;
    const rand = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    const bars = [];
    let close = 100;
    let day = Date.UTC(2023, 0, 2) / 1000;
    while (bars.length < count) {
      const wd = new Date(day * 1000).getUTCDay();
      if (wd !== 0 && wd !== 6) {
        const open = close;
        close = Math.max(1, open * (1 + (rand() - 0.49) * 0.04));
        const high = Math.max(open, close) * (1 + rand() * 0.012);
        const low = Math.min(open, close) * (1 - rand() * 0.012);
        bars.push({ time: new Date(day * 1000).toISOString().slice(0, 10), open: +open.toFixed(2), high: +high.toFixed(2),
          low: +low.toFixed(2), close: +close.toFixed(2), volume: Math.round(200000 + rand() * 800000) });
      }
      day += 86400;
    }
    return bars;
  }
  // Wilder's RSI, written out here so the example needs only the core bundle.
  function rsi(bars, n) {
    const out = [];
    let gain = 0, loss = 0;
    for (let i = 0; i < bars.length; i++) {
      if (i === 0) { out.push({ time: bars[i].time }); continue; }
      const d = bars[i].close - bars[i - 1].close;
      const g = Math.max(0, d), l = Math.max(0, -d);
      if (i <= n) { gain += g / n; loss += l / n; } else { gain = (gain * (n - 1) + g) / n; loss = (loss * (n - 1) + l) / n; }
      out.push(i < n ? { time: bars[i].time } : { time: bars[i].time, value: +(loss === 0 ? 100 : 100 - 100 / (1 + gain / loss)).toFixed(2) });
    }
    return out;
  }

  const L = ChartistLite;
  const bars = makeBars(600, 7);
  const chart = L.createChart('chart', { theme: 'light', ariaLabel: 'DEMO daily price chart with RSI' });
  const candles = chart.addSeries(L.CandlestickSeries, { title: 'DEMO' });
  candles.setData(bars);
  const volume = chart.addSeries(L.HistogramSeries, { title: 'Volume', priceScaleId: 'volume', lastValueVisible: false, priceLineVisible: false, priceFormat: { precision: 0, minMove: 1 } });
  chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  volume.setData(bars.map(b => ({ time: b.time, value: b.volume })));
  // A benchmark on the LEFT scale: a different price range, read on its own axis.
  const bench = chart.addSeries(L.LineSeries, { title: 'Benchmark', priceScaleId: 'left', lineWidth: 1, color: '#8E8E93', lastValueVisible: true, priceLineVisible: false, priceFormat: { precision: 0, minMove: 1 } });
  bench.setData(bars.map((b, i) => ({ time: b.time, value: Math.round(18000 + (b.close - 100) * 60 + Math.sin(i / 20) * 300) })));

  const rsiLine = chart.addSeries(L.LineSeries, { title: 'RSI 14', lineWidth: 2, priceLineVisible: false }, 1);
  rsiLine.setData(rsi(bars, 14));
  L.createPriceLine(rsiLine, { price: 70, lineStyle: 'dotted', axisLabelVisible: false });
  L.createPriceLine(rsiLine, { price: 30, lineStyle: 'dotted', axisLabelVisible: false });

  document.getElementById('theme').addEventListener('click', e => {
    const dark = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    chart.applyOptions({ theme: dark ? 'dark' : 'light' });
    e.currentTarget.textContent = dark ? 'Light theme' : 'Dark theme';
  });
  document.getElementById('fit').addEventListener('click', () => chart.timeScale().fitContent());

  window.__demo = { chart, candles, volume, bench, rsiLine, bars };
</script>
</body>
</html>
