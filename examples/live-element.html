<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chartist Lite: live element</title>
<style>body { margin: 0; padding: 16px; background: #F8F8F8; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; } chartist-chart { border-radius: 16px; overflow: hidden; border: 1px solid rgba(0,0,0,0.1); background: #fff; }</style>
</head>
<body>
<!-- Zero JavaScript of your own: the element-live build and one tag. -->
<script src="../dist/chartist-lite.element-live.iife.min.js"></script>
<chartist-chart id="btc" live symbol="BTC-USD" interval="1m" provider="coinbase" volume height="420" theme="light" loading="eager" aria-label="Bitcoin, live, one-minute candles">
  <p>Live Bitcoin price chart (needs JavaScript).</p>
</chartist-chart>
</body>
</html>
