<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chartist Lite: basic</title>
<style>
  :root { color-scheme: light; --bg: #F8F8F8; --ink: #1D1D1F; --muted: #6E6E73; --card: #FFFFFF; --edge: rgba(0,0,0,0.1); }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #0C0C0C; --ink: #F5F5F7; --muted: #98989D; --card: #141414; --edge: rgba(255,255,255,0.12); }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
    font: 400 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  #legend { color: var(--muted); font-variant-numeric: tabular-nums; min-height: 20px; }
  button { font: inherit; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--edge);
    background: var(--card); color: var(--ink); cursor: pointer; }
  button:focus-visible { outline: 2px solid #0066CC; outline-offset: 2px; }
  #chart { height: 420px; border-radius: 16px; overflow: hidden; border: 1px solid var(--edge); background: var(--card); }
</style>
</head>
<body>
<header>
  <h1>DEMO · daily candles and a 20-bar average</h1>
  <div>
    <button id="theme" type="button">Dark theme</button>
    <button id="tick" type="button">Live tick</button>
  </div>
</header>
<div id="legend"></div>
<div id="chart"></div>
<script src="../dist/chartist-lite.iife.min.js"></script>
<script>
  // Deterministic data: a seeded random walk, business days only (no weekends).
  function makeBars(count, seed) {
    let s = seed >>> 0;
    const rand = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    const bars = [];
    let close = 100;
    let day = Date.UTC(2023, 0, 2) / 1000;
    while (bars.length < count) {
      const wd = new Date(day * 1000).getUTCDay();
      if (wd !== 0 && wd !== 6) {
        const open = close;
        close = Math.max(1, open * (1 + (rand() - 0.49) * 0.04));
        const high = Math.max(open, close) * (1 + rand() * 0.012);
        const low = Math.min(open, close) * (1 - rand() * 0.012);
        const d = new Date(day * 1000);
        const time = d.toISOString().slice(0, 10);
        bars.push({ time, open: +open.toFixed(2), high: +high.toFixed(2), low: +low.toFixed(2), close: +close.toFixed(2) });
      }
      day += 86400;
    }
    return bars;
  }
  function sma(bars, n) {
    const out = [];
    let sum = 0;
    for (let i = 0; i < bars.length; i++) {
      sum += bars[i].close;
      if (i >= n) sum -= bars[i - n].close;
      out.push(i >= n - 1 ? { time: bars[i].time, value: +(sum / n).toFixed(2) } : { time: bars[i].time });
    }
    return out;
  }

  const { createChart, CandlestickSeries, LineSeries, formatPrice } = ChartistLite;
  const bars = makeBars(600, 7);
  const chart = createChart('chart', { theme: 'light', ariaLabel: 'DEMO daily price chart' });
  const candles = chart.addSeries(CandlestickSeries, { title: 'DEMO' });
  const avg = chart.addSeries(LineSeries, { title: 'SMA 20', lineWidth: 2, lastValueVisible: false, priceLineVisible: false });
  candles.setData(bars);
  avg.setData(sma(bars, 20));

  const legend = document.getElementById('legend');
  chart.subscribeCrosshairMove(p => {
    const row = p.seriesData.get(candles);
    legend.textContent = row ? `${row.time}  O ${formatPrice(row.open, 2)}  H ${formatPrice(row.high, 2)}  L ${formatPrice(row.low, 2)}  C ${formatPrice(row.close, 2)}` : '';
  });

  const themeBtn = document.getElementById('theme');
  themeBtn.addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    chart.applyOptions({ theme: dark ? 'dark' : 'light' });
    themeBtn.textContent = dark ? 'Light theme' : 'Dark theme';
  });

  // A live tick: replace the last bar, then append a new one.
  document.getElementById('tick').addEventListener('click', () => {
    const last = bars[bars.length - 1];
    const close = +(last.close * 1.01).toFixed(2);
    candles.update({ ...last, close, high: Math.max(last.high, close) });
  });

  window.__demo = { chart, candles, avg, bars };
</script>
</body>
</html>
